name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Automated PR Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request and post a concise summary of:
            1. Code quality and adherence to project patterns (this repo uses
               Vue 3 Composition API + `<script setup>` on the frontend and
               FastAPI + Pydantic on the backend — see CLAUDE.md).
            2. Any obvious bugs, missing edge cases, or breaking changes.
            3. Whether the change matches its stated intent.

            Use inline comments for specific issues; use a top-level comment
            for the summary.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
